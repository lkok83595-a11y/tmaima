<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f1e8">
<title>كتالوج المنتجات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a2b;--soft:#566160;--faint:#8c9694;--surface:#f6f1e8;--card:#fffdf8;--border:#ebe3d4;--teal:#0f766e;--teal-bg:#e4f1ee;--sunk:#f1ebdf;
--font:'IBM Plex Sans Arabic',-apple-system,'Segoe UI',Tahoma,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font);font-variant-numeric:tabular-nums}
header{padding:22px 16px 6px;text-align:center}
header h1{margin:0;font-size:22px;font-weight:700}
header p{margin:4px 0 0;color:var(--faint);font-size:13px}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 14px 8px;border-bottom:1px solid var(--border)}
.search{width:100%;height:44px;border:1px solid var(--border);background:var(--sunk);border-radius:14px;padding:0 14px;font:500 15px var(--font);color:var(--ink);outline:none}
.search:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border);background:var(--card);color:var(--soft);border-radius:999px;padding:7px 15px;font:600 13px var(--font);cursor:pointer}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
main{padding:14px;max-width:980px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(60,45,20,.04),0 6px 20px rgba(60,45,20,.05)}
.ph{aspect-ratio:1/1;background:var(--sunk);position:relative;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{display:grid;place-items:center;height:100%;font-size:34px;color:var(--faint)}
.code{position:absolute;top:8px;right:8px;background:rgba(31,42,43,.72);color:#fff;border-radius:8px;padding:2px 9px;font-size:12px;font-weight:600}
.info{padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-size:14px;font-weight:600;line-height:1.4;min-height:39px}
.cat{align-self:flex-start;background:var(--teal-bg);color:var(--teal);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:600}
.price{font-size:19px;font-weight:700;color:var(--teal);margin-top:auto}
.order{display:flex;align-items:center;justify-content:center;gap:6px;height:40px;border-radius:12px;background:var(--teal);color:#fff;text-decoration:none;font:600 14px var(--font);margin-top:4px}
.order:active{background:#115e59}
.msg{text-align:center;color:var(--faint);padding:50px 10px;font-size:15px}
.lb{position:fixed;inset:0;background:rgba(31,42,43,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.lb.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;position:relative}
.sheet .big{width:100%;aspect-ratio:1/1;background:var(--sunk);display:block;object-fit:contain}
.sheet .body{padding:14px 16px 20px;display:flex;flex-direction:column;gap:8px}
.sheet .name{font-size:18px;min-height:0}
.sheet .price{font-size:24px}
.x{position:absolute;top:10px;left:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,253,248,.92);font-size:20px;color:var(--ink);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.card{cursor:pointer}
.hint{font-size:12px;color:var(--faint);text-align:center}
button.order{border:0;cursor:pointer;width:100%}
.shot{background:var(--teal-bg);color:var(--teal);border-radius:12px;padding:11px 12px;text-align:center;font-weight:600;font-size:14px;margin-top:4px}
footer{text-align:center;color:var(--faint);font-size:12px;padding:10px 0 28px}
</style>
</head>
<body>
<header><h1 id="shop">كتالوج المنتجات</h1><p>اختار الموديل واضغط اطلب</p></header>
<div class="bar"><input class="search" id="q" type="search" placeholder="ابحث بالاسم أو الكود..." autocomplete="off"><div class="chips" id="chips"></div></div>
<main><div class="grid" id="grid"></div><div class="msg" id="msg">جاري التحميل...</div></main>
<footer id="foot"></footer>
<div class="lb" id="lb"><div class="sheet" id="sheet"></div></div>
<script>
(function(){
var URL_="https://rlfwqedyeazqksrboxsc.supabase.co/rest/v1/";
var KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsZndxZWR5ZWF6cWtzcmJveHNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2ODEyMzAsImV4cCI6MjExMDI1NzIzMH0.AnqZ0BreeNJZdUkVvqDy5hUszNhD5F1Viz_aAEX5rao";
var H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
var cur=null,file=null,url_=null,items=[],shown=[],cat="all",phone="",shop="";
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function safeImg(u){u=String(u||"");return /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(u)||/^https:\/\//.test(u)?u:""}
function fmt(n){n=Number(n)||0;return n.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2})}
function waNum(p){p=String(p||"").replace(/\D/g,"");if(p.indexOf("00")===0)p=p.slice(2);if(p.charAt(0)==="0")p="20"+p.slice(1);return p}
function load(){
 return fetch(URL_+"rpc/catalog_public",{method:"POST",headers:H,body:"{}"}).then(function(r){
  if(!r.ok)throw new Error("rpc");return r.json();
 }).catch(function(){
  /* PREVIEW FALLBACK (removed once the read-only function is approved): safe columns only */
  return Promise.all([
   fetch(URL_+"products?archived_at=is.null&select=id,code,name,category,sell_price,image&order=code.asc",{headers:H}).then(function(r){return r.json()}),
   fetch(URL_+"shop_settings?id=eq.1&select=data",{headers:H}).then(function(r){return r.json()})
  ]).then(function(a){var d=(a[1][0]&&a[1][0].data)||{};return{shop:{name:d.nameAr||"",phone:d.phone1||""},products:a[0]}});
 });
}
function render(){
 var q=$("q").value.trim().toLowerCase();
 var list=items.filter(function(p){
  if(cat!=="all"&&p.category!==cat)return false;
  if(!q)return true;
  return String(p.name||"").toLowerCase().indexOf(q)>=0||String(p.code||"").toLowerCase().indexOf(q)>=0;
 });
shown=list;
 $("msg").style.display=list.length?"none":"block";
 $("msg").textContent=items.length?"مفيش نتائج":"مفيش منتجات حالياً";
 $("grid").innerHTML=list.map(function(p,i){
  var img=safeImg(p.image),code=p.code&&!/^\d{13}$/.test(String(p.code))?String(p.code):"";
  var text="أهلاً، عايز أطلب: "+p.name+(code?" (كود "+code+")":"")+" - السعر "+fmt(p.sell_price)+" ج";
  var href=phone?"https://wa.me/"+phone+"?text="+encodeURIComponent(text):"#";
  return '<div class="card" data-i="'+i+'"><div class="ph">'+
   (img?'<img loading="lazy" decoding="async" alt="'+esc(p.name)+'" src="'+esc(img)+'">':'<div class="noimg">\ud83d\udc5f</div>')+
   (code?'<span class="code">#'+esc(code)+'</span>':'')+'</div><div class="info"><div class="name">'+esc(p.name)+'</div>'+
   (p.category?'<span class="cat">'+esc(p.category)+'</span>':'')+
   '<div class="price">'+fmt(p.sell_price)+' ج</div>'+
   '</div></div>';
 }).join("");
}
function chips(){
 var cats=[];items.forEach(function(p){if(p.category&&cats.indexOf(p.category)<0)cats.push(p.category)});
 $("chips").innerHTML='<button class="chip'+(cat==="all"?" on":"")+'" data-c="all">الكل</button>'+cats.map(function(c){return '<button class="chip'+(cat===c?" on":"")+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join("");
}
$("chips").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;cat=b.getAttribute("data-c");chips();render()});
$("q").addEventListener("input",render);
function open_(p){
 var img=safeImg(p.image),code=p.code&&!/^\d{13}$/.test(String(p.code))?String(p.code):"";
 var text="أهلاً، عايز أطلب: "+p.name+(code?" (كود "+code+")":"")+" - السعر "+fmt(p.sell_price)+" ج";
 var href=phone?"https://wa.me/"+phone+"?text="+encodeURIComponent(text):"#";
 $("sheet").innerHTML='<button class="x" aria-label="إغلاق">\u00d7</button>'+(img?'<img class="big" alt="'+esc(p.name)+'" src="'+esc(img)+'">':'<div class="big noimg">\ud83d\udc5f</div>')+
  '<div class="body"><div class="name">'+esc(p.name)+'</div>'+(code?'<div style="color:var(--faint);font-size:13px">كود: #'+esc(code)+'</div>':'')+(p.category?'<span class="cat">'+esc(p.category)+'</span>':'')+
  '<div class="price">'+fmt(p.sell_price)+' ج</div><button class="order" id="shareImg" type="button">📸 صوّر المنتج و ابعتها لنا</button><div class="hint" id="hint">أو خد سكرين شوت للشاشة و ابعتها لنا</div><img id="out" alt="" style="display:none;width:100%;border-radius:12px"></div>';
 cur=p;file=null;url_=null;makeFile(p).then(function(r){if(cur===p){file=r&&r.file;url_=r&&r.url}});
 $("lb").classList.add("on");document.body.style.overflow="hidden";
}
function makeFile(p){
 var src=safeImg(p.image);if(!src)return Promise.resolve(null);
 var code=p.code&&!/^\d{13}$/.test(String(p.code))?String(p.code):"";
 return (document.fonts&&document.fonts.load?document.fonts.load('700 40px "IBM Plex Sans Arabic"'):Promise.resolve()).catch(function(){}).then(function(){
  return new Promise(function(res){
   var im=new Image();
   im.onload=function(){
    var S=800,c=document.createElement("canvas");c.width=S;c.height=S;var x=c.getContext("2d");
    var r=Math.max(S/im.width,S/im.height),w=im.width*r,h=im.height*r;
    x.drawImage(im,(S-w)/2,(S-h)/2,w,h);
    var g=x.createLinearGradient(0,S*0.62,0,S);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.72)");
    x.fillStyle=g;x.fillRect(0,S*0.62,S,S*0.38);
    x.direction="rtl";x.textAlign="right";x.fillStyle="#fff";x.shadowColor="rgba(0,0,0,.5)";x.shadowBlur=8;
    x.font='700 56px "IBM Plex Sans Arabic",Arial';x.fillText(fmt(p.sell_price)+" ج",S-28,S-30);
    x.font='600 34px "IBM Plex Sans Arabic",Arial';x.fillText(String(p.name||""),S-28,S-100);
    if(code){x.textAlign="left";x.font='700 32px "IBM Plex Sans Arabic",Arial';x.fillText("#"+code,28,S-30)}
    try{c.toBlob(function(b){res(b?{file:new File([b],"product-"+(code||p.id)+".jpg",{type:"image/jpeg"}),url:URL.createObjectURL(b)}:null)},"image/jpeg",0.88)}catch(e){res(null)}
   };
   im.onerror=function(){res(null)};im.src=src;
  });
 });
}
function doShare(){
 if(!file){$("hint").textContent="خد سكرين شوت للشاشة و ابعتها لنا";return}
 if(navigator.canShare&&navigator.canShare({files:[file]})){
  navigator.share({files:[file]}).catch(function(){});
 }else{
  var o=$("out");o.src=url_;o.style.display="block";
  $("hint").textContent="اضغط مطولاً على الصورة و احفظها، أو خد سكرين شوت و ابعتها لنا";
 }
}
function close_(){$("lb").classList.remove("on");document.body.style.overflow=""}
$("grid").addEventListener("click",function(e){if(e.target.closest(".order"))return;var c=e.target.closest(".card");if(!c)return;var p=shown[+c.getAttribute("data-i")];if(p)open_(p)});
$("sheet").addEventListener("click",function(e){if(e.target.id==="shareImg")doShare()});
$("lb").addEventListener("click",function(e){if(e.target.id==="lb"||e.target.closest(".x"))close_()});
load().then(function(d){
 var sh=d.shop||{};shop=sh.name||"";phone=waNum(sh.phone);
 if(shop){$("shop").textContent=shop;document.title=shop+" - كتالوج"}
 items=(d.products||[]).map(function(p){return{id:p.id,code:p.code,name:p.name,category:p.category,sell_price:p.sell_price,image:p.image}});
 chips();render();
}).catch(function(){$("msg").textContent="تعذر تحميل المنتجات، جرب تاني بعد شوية"});
})();
</script>
</body>
</html>
